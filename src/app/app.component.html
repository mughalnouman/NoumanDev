<!-- FUTURISTIC ARCHITECTURAL PRELOADER -->
<div *ngIf="isPreloaderVisible" class="cyber-preloader" (click)="skipPreloader()" aria-label="Loading portfolio experience">
  <div class="preloader-grid"></div>
  <div class="preloader-ambient-glow"></div>
  
  <div class="preloader-content">
    <!-- Center Monogram Hologram -->
    <div class="preloader-rings-wrapper">
      <div class="ring-pulse"></div>
      <div class="ring-spin"></div>
      <div class="ring-core">
        <span class="core-brand">NA</span>
      </div>
    </div>

    <!-- Title & Tagline -->
    <div class="preloader-titles">
      <h2 class="preloader-name">Nouman Ahmad</h2>
      <p class="preloader-sub">Full Stack & Distributed Systems Architect</p>
    </div>

    <!-- Laser Progress Meter -->
    <div class="preloader-meter-bar">
      <div class="preloader-meter-fill" [style.width.%]="loadingProgress">
        <div class="meter-laser-spark"></div>
      </div>
    </div>

    <!-- Progress Percentage & Live System Log -->
    <div class="preloader-status-row">
      <div class="status-stream">
        <span class="stream-dot">●</span>
        <span class="stream-text">{{ statusLog }}</span>
      </div>
      <div class="status-percent font-mono">
        <b>{{ loadingProgress }}</b><span>%</span>
      </div>
    </div>

    <!-- Interactive Skip Hint -->
    <div class="preloader-skip-hint">
      <span>Click anywhere to skip ↗</span>
    </div>
  </div>
</div>

<main>
  <div class="noise"></div>
  <div class="progress"></div>
  <header class="navbar" aria-label="Primary navigation">
    <a class="brand" routerLink="/">
      <span>NA</span>
      <small>Nouman Ahmad</small>
    </a>
    <nav [class.open]="menuOpen">
      <a *ngFor="let item of nav" [routerLink]="item[1]" routerLinkActive="active" [routerLinkActiveOptions]="{exact:item[1] === '/'}" (click)="menuOpen=false">
        {{ item[0] }}
      </a>
    </nav>
    <div class="nav-actions">
      <a class="talk" routerLink="/contact">Let's Talk <span>↗</span></a>
      <button class="menu" (click)="menuOpen=!menuOpen" aria-label="Open menu">☰</button>
